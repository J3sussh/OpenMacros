name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # reaproveitado por release.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Escolha deliberada: usa o python3 do SISTEMA (3.12 no Ubuntu 24.04) em vez de
# actions/setup-python. PyGObject (python3-gi) e as typelibs GTK4/libadwaita vêm
# do apt e so funcionam com o python do sistema; compilar PyGObject num python
# do setup-python seria lento e frágil. Nenhuma dependência é instalada via pip.
# O ubuntu-24.04 traz libadwaita 1.5 / GTK 4.14: o código não usa APIs mais novas
# (Adw.Spinner, 1.6+, tem fallback para Gtk.Spinner em gui/pages/devices.py).

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Sem barramento de acessibilidade (evita ruído/flakiness de "SpiRegistry").
      NO_AT_BRIDGE: "1"
      GTK_A11Y: none
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            python3-evdev python3-pyudev python3-xlib \
            xvfb dbus dbus-x11 xclip librsvg2-common \
            adwaita-icon-theme shared-mime-info

      - name: Versões
        run: |
          python3 --version
          python3 -c "import gi; gi.require_version('Adw','1'); from gi.repository import Adw; print('libadwaita', Adw.get_major_version(), Adw.get_minor_version())"

      - name: pytest
        run: xvfb-run -a dbus-run-session -- python3 -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: compileall
        run: python3 -m compileall -q src tests

      - name: bash -n
        run: |
          for f in scripts/*.sh packaging/deb/*.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm; do bash -n "$f"; done

      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck scripts/*.sh packaging/deb/*.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
          else
            echo "shellcheck indisponível; pulando"
          fi

  deb:
    name: deb
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar o .deb
        run: packaging/deb/build-deb.sh --out dist

      - name: Inspecionar
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: openmacros-plus-deb
          path: dist/*.deb
          if-no-files-found: error
