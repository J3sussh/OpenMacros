name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: build and publish
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/deb/build-deb.sh --version "$VERSION" --out dist
          dpkg-deb -I dist/*.deb

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum ./*.deb | sed 's|  \./|  |' > SHA256SUMS && cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
